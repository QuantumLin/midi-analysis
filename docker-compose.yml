name: midi-analysis

services:
  backend:
    build:
      context: ./backend
      args:
        INSTALL_DEV: "true"  # include pytest for `docker compose exec backend pytest`
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - path: .env
        required: false
    environment:
      # Polling is needed for hot reload with bind mounts from Windows/macOS hosts.
      WATCHFILES_FORCE_POLLING: "true"
    ports:
      - "${BACKEND_PORT:-8001}:8000"
    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  frontend:
    build: ./frontend
    environment:
      API_PROXY_TARGET: http://backend:8000
      VITE_USE_POLLING: "true"
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      # Keep the container's node_modules instead of the (possibly missing) host folder.
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy
