<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="MIDI Analysis">
  <defs>
    <radialGradient id="tile" cx="50%" cy="0%" r="110%">
      <stop offset="0" stop-color="#231c52"/>
      <stop offset="0.6" stop-color="#0d0d22"/>
      <stop offset="1" stop-color="#07070f"/>
    </radialGradient>
    <linearGradient id="neon" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#ff2bd6"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Tile -->
  <rect width="64" height="64" rx="14" fill="url(#tile)"/>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="url(#neon)" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- Piano keys rising like analyzer bars -->
  <g filter="url(#glow)" fill="url(#neon)">
    <rect x="11" y="33" width="9" height="20" rx="2.5"/>
    <rect x="22" y="23" width="9" height="30" rx="2.5"/>
    <rect x="33" y="28" width="9" height="25" rx="2.5"/>
    <rect x="44" y="15" width="9" height="38" rx="2.5"/>
    <!-- Peak hold on the tallest key -->
    <rect x="44" y="9.5" width="9" height="2.5" rx="1.25"/>
  </g>

  <!-- Black keys between the white ones -->
  <g fill="#0b0c1a">
    <rect x="17.5" y="40" width="6" height="13" rx="1.5"/>
    <rect x="28.5" y="40" width="6" height="13" rx="1.5"/>
    <rect x="39.5" y="40" width="6" height="13" rx="1.5"/>
  </g>
</svg>
